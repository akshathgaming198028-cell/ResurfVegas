name: Build Android 64-bit (test)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 (IL2CPP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch project for ARM64 test (CI only, not committed)
        run: python3 -I .github/scripts/patch_arm64.py

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2019.4.41f2
          versioning: None
          buildMethod: CIArm64Build.Build
          targetPlatform: Android
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Sign and check ARM64 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -e
          SRC=build/Android/ResurfVegas-arm64.apk
          unzip -l "$SRC" | tee apk-list.txt | grep -q "lib/arm64-v8a/" || { echo "NO arm64-v8a libs in APK"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          mkdir -p out
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ks.jks
          "$BT/zipalign" -f -p 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-type JKS --ks-key-alias "$ANDROID_KEYALIAS_NAME" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASS" --key-pass "pass:$ANDROID_KEYALIAS_PASS" \
            --out out/ResurfVegas-arm64-signed.apk aligned.apk
          "$BT/apksigner" verify out/ResurfVegas-arm64-signed.apk && echo "signed ok"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-apk
          path: out/ResurfVegas-arm64-signed.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-${{ github.run_number }}
          name: ARM64 test ${{ github.run_number }}
          prerelease: true
          files: out/ResurfVegas-arm64-signed.apk
