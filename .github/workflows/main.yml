name: Build Android

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2019.4.41f2
          targetPlatform: Android
          versioning: None
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Patch launcher icon into APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick zip unzip
          APK_PATH=$(find build/Android -name "*.apk" | head -n 1)
          ICON="$GITHUB_WORKSPACE/Assets/Icons/app_icon_rv.png"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          WORK=$(mktemp -d)
          unzip -q "$GITHUB_WORKSPACE/$APK_PATH" -d "$WORK/apk"
          cd "$WORK/apk"
          rm -rf META-INF
          COLOR=$(convert "$ICON" -format "%[hex:p{0,0}]" info:)
          M=res/mipmap-mdpi-v4
          convert "$ICON" -resize 192x192 $M/app_icon.png
          convert "$ICON" -resize 127x127 -background none -gravity center -extent 192x192 $M/ic_launcher_foreground.png
          convert -size 192x192 xc:"#${COLOR:0:6}" $M/ic_launcher_background.png
          zip -q -r -X "$WORK/unsigned.apk" . -x "resources.arsc"
          zip -q -X -0 "$WORK/unsigned.apk" resources.arsc
          cd "$WORK"
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ks.jks
          rm -f "$GITHUB_WORKSPACE/ResurfVegas-Android.apk"
          "$BT/apksigner" sign --ks ks.jks --ks-type JKS --ks-key-alias "$ANDROID_KEYALIAS_NAME" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASS" --key-pass "pass:$ANDROID_KEYALIAS_PASS" \
            --out "$GITHUB_WORKSPACE/ResurfVegas-Android.apk" aligned.apk
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/ResurfVegas-Android.apk" && echo "signed ok"

      - name: Rename APK
        run: |
          APK_PATH=$(find build/Android -name "*.apk" | head -n 1 || true)
          if [ ! -f ResurfVegas-Android.apk ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" ResurfVegas-Android.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-Android
          path: ResurfVegas-Android.apk
          if-no-files-found: ignore

  release:
    name: Create prerelease
    if: success()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
